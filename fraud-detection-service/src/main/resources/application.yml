spring:
  application:
    name: fraud-detection-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/fraud_db}
    username: ${JDBC_DATABASE_USERNAME:wallet}
    password: ${JDBC_DATABASE_PASSWORD:wallet}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-detection-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.smartwallet.*"
        spring.json.value.default.type: "com.smartwallet.common.dto.TransactionDto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082
